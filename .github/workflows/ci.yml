name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build + unit/smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Prepare owned fixture temporary directory
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = fs.realpathSync(fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, "abs-ci-")));
          fs.chmodSync(root, 0o700);
          fs.appendFileSync(process.env.GITHUB_ENV, `TMPDIR=${root}\n`);
          NODE
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Unit + smoke tests
        # Report leaked handles if Vitest reaches its shutdown deadline;
        # synchronous loops must be bounded in the code under test.
        run: npx vitest run tests/unit tests/smoke --reporter=default --reporter=hanging-process
      - name: Coverage (unit + smoke, threshold gated)
        run: npx vitest run --coverage tests/unit tests/smoke
      - name: i18n + file size checks
        run: npm run check:i18n && npm run check:size

  # Source-level checks are cheap and run above; these two need a browser, so
  # they get their own job instead of eating the Linux job's 20-minute budget.
  # Both gate on exit 1; visual-dialogs exits 2 when no chromium is present and
  # treats that as a skip, so a missing download cannot fail the build.
  ui-audit:
    name: UI audit (tabs + dialogs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - name: Cache Playwright chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install chromium
        run: npx playwright install --with-deps chromium
      - name: Tab audit (12 categories, zh + en)
        run: node scripts/visual-shot.mjs --audit
      - name: Dialog sweep (all dialogs, zh + en)
        run: node scripts/visual-dialogs.mjs

  checks-windows:
    name: Build + unit/smoke (Windows)
    runs-on: windows-latest
    # Bound the combined plain + coverage workload. A larger job budget does
    # not fix a blocked worker; fail fast below so assertion diagnostics are
    # printed before another test can consume the remaining budget.
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Prepare owned fixture temporary directory
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = fs.realpathSync(fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, "abs-ci-")));
          fs.chmodSync(root, 0o700);
          fs.appendFileSync(process.env.GITHUB_ENV, `TMPDIR=${root}\n`);
          NODE
      - name: Inspect minimum-runtime filesystem metadata
        run: node scripts/ci-filesystem-probe.mjs
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build (bash on Windows)
        # Kept inline: `npm run build` shells through cmd on Windows and its
        # &&/quoting fails there (see b28520d). Keep this list in step with the
        # `build` script in package.json — tests/unit/brand-assets.test.ts fails
        # if a shipped resource is missing from either.
        run: |
          rm -rf dist
          npx tsc
          mkdir -p dist/renderer dist/resources
          cp -r src/renderer/index.html src/renderer/storage-migrate.html src/renderer/css src/renderer/js dist/renderer/
          cp src/main/preload.cjs dist/main/
          cp resources/tray-icon-Template.png resources/tray-icon-Template@2x.png dist/resources/
          cp resources/icon.icns resources/icon.ico dist/resources/
          node scripts/build-masque-bridge.mjs
      - name: Cold-profile directory ancestry regressions
        timeout-minutes: 5
        run: npx vitest run tests/unit/created-directory-ancestry.test.ts tests/unit/webrtc-preferences.test.ts --bail=1 --maxWorkers=1 --reporter=default
      - name: Native recovery unit diagnostics
        timeout-minutes: 15
        # Collect this bounded slice's real failures together. Failure still
        # exits nonzero; the full-suite and coverage gates below are unchanged.
        run: >-
          npx vitest run
          tests/unit/profile-archive-sync-recovery.test.ts
          tests/unit/sync-full-profile-artifact.test.ts
          tests/unit/full-profile-responsiveness.test.ts
          tests/unit/sync-tar-lifecycle.test.ts
          tests/unit/sync-sqlite-local-storage.test.ts
          tests/unit/sync-history-transport.test.ts
          tests/unit/sync-restore-safety.test.ts
          tests/unit/profile-archive-safety.test.ts
          tests/unit/profile-archive.test.ts
          tests/unit/full-profile-config-durability.test.ts
          tests/unit/cookie-export-snapshot.test.ts
          tests/unit/fingerprint-drift-reports.test.ts
          tests/unit/profile-credentials.test.ts
          tests/unit/profile-credentials-staging.test.ts
          tests/unit/full-profile-recovery-lock.test.ts
          tests/unit/firefox-cookie-import.test.ts
          tests/unit/agent-tool-local.test.ts
          tests/unit/ui-goal-account-transport.test.ts
          tests/unit/sync-service.test.ts
          tests/unit/renderer-profile-trash-f09.test.ts
          tests/unit/profile-mutation-restore-lock.test.ts
          tests/unit/health-launch-proxy.test.ts
          tests/unit/ipc-thin-routes.test.ts
          tests/unit/storage-monitor.test.ts
          tests/unit/storage-renderer.test.ts
          --bail=0 --maxWorkers=1 --reporter=default --reporter=hanging-process
          --reporter=json --outputFile="$TMPDIR/native-recovery.json"
      - name: Summarize native recovery unit diagnostics
        if: always()
        run: node scripts/ci-native-test-summary.mjs "$TMPDIR/native-recovery.json" 25
      - name: Unit + smoke tests
        id: unit_smoke
        # Failure still exits nonzero; a green run must execute the whole suite.
        run: npx vitest run tests/unit tests/smoke --bail=1 --reporter=default --reporter=hanging-process --reporter=json --outputFile="$TMPDIR/unit-smoke.json"
      - name: Summarize unit + smoke results
        if: always() && (steps.unit_smoke.outcome == 'success' || steps.unit_smoke.outcome == 'failure')
        run: node scripts/ci-native-test-summary.mjs "$TMPDIR/unit-smoke.json" all
      - name: Coverage (unit + smoke, threshold gated)
        run: npx vitest run --coverage tests/unit tests/smoke --bail=1

  e2e-macos:
    name: E2E (macOS, needs locally built engine — see engine-verify)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - name: E2E (skipped without an engine binary)
        run: |
          if [ -n "$AGENT_BROWSER_CHROMIUM_BINARY_PATH" ] || [ -n "$AGENT_BROWSER_CHROMIUM_CACHE_DIR" ]; then
            npm run test:e2e
          else
            echo "no independent engine present; e2e runs in the engine-verify workflow (macOS/large runner)"
          fi
        env:
          AGENT_BROWSER_CHROMIUM_BINARY_PATH: ${{ secrets.AGENT_BROWSER_CHROMIUM_BINARY_PATH }}