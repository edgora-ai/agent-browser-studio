name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build + unit/smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Unit + smoke tests
        run: npx vitest run tests/unit tests/smoke
      - name: Coverage (unit + smoke, threshold gated)
        run: npx vitest run --coverage tests/unit tests/smoke

  checks-windows:
    name: Build + unit/smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build (bash on Windows)
        run: npm run build
      - name: Unit + smoke tests
        run: npx vitest run tests/unit tests/smoke
      - name: Coverage (unit + smoke, threshold gated)
        run: npx vitest run --coverage tests/unit tests/smoke

  e2e-macos:
    name: E2E (macOS, needs locally built engine — see engine-verify)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - run: npm ci
      - name: E2E (skipped without an engine binary)
        run: |
          if [ -n "$AGENT_BROWSER_CHROMIUM_BINARY_PATH" ] || [ -n "$AGENT_BROWSER_CHROMIUM_CACHE_DIR" ]; then
            npm run test:e2e
          else
            echo "no independent engine present; e2e runs in the engine-verify workflow (macOS/large runner)"
          fi
        env:
          AGENT_BROWSER_CHROMIUM_BINARY_PATH: ${{ secrets.AGENT_BROWSER_CHROMIUM_BINARY_PATH }}