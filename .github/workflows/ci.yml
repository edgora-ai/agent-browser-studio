name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build + unit/smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: npm ci
      - name: Prepare owned fixture temporary directory
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = fs.realpathSync(fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, "abs-ci-")));
          fs.chmodSync(root, 0o700);
          fs.appendFileSync(process.env.GITHUB_ENV, `TMPDIR=${root}\n`);
          NODE
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Unit + smoke tests
        # Report leaked handles if Vitest reaches its shutdown deadline;
        # synchronous loops must be bounded in the code under test.
        run: npx vitest run tests/unit tests/smoke --reporter=default --reporter=hanging-process
      - name: Coverage (unit + smoke, threshold gated)
        run: npx vitest run --coverage tests/unit tests/smoke
      - name: i18n + file size checks
        run: npm run check:i18n && npm run check:size

  # Source-level checks are cheap and run above; these two need a browser, so
  # they get their own job instead of eating the Linux job's 20-minute budget.
  # Both gate on exit 1; visual-dialogs exits 2 when no chromium is present and
  # treats that as a skip, so a missing download cannot fail the build.
  ui-audit:
    name: UI audit (tabs + dialogs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - run: npm ci
      - name: Cache Playwright chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install chromium
        run: npx playwright install --with-deps chromium
      - name: Tab audit (12 categories, zh + en)
        run: node scripts/visual-shot.mjs --audit
      - name: Dialog sweep (all dialogs, zh + en)
        run: node scripts/visual-dialogs.mjs

  checks-windows:
    name: Build + unit/smoke (Windows)
    runs-on: windows-latest
    # Bound the combined plain + coverage workload. A larger job budget does
    # not fix a blocked worker; fail fast below so assertion diagnostics are
    # printed before another test can consume the remaining budget.
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: npm ci
      - name: Prepare owned fixture temporary directory
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = fs.realpathSync(fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, "abs-ci-")));
          fs.chmodSync(root, 0o700);
          fs.appendFileSync(process.env.GITHUB_ENV, `TMPDIR=${root}\n`);
          NODE
      - name: Inspect owned filesystem metadata
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs"), path = require("node:path");
          const root = fs.mkdtempSync(path.join(process.env.TMPDIR, "metadata-probe-"));
          const owner = fs.lstatSync(root), file = path.join(root, "owned.bin");
          const fields = stat => Object.fromEntries(["dev", "ino", "size", "mode", "nlink", "uid", "gid", "mtimeMs", "ctimeMs", "birthtimeMs"].map(key => [key, stat[key]]));
          let fd;
          try {
            fd = fs.openSync(file, "wx", 0o600);
            fs.writeFileSync(fd, "owned metadata fixture"); fs.fsyncSync(fd); fs.closeSync(fd); fd = undefined;
            const before = fields(fs.lstatSync(file));
            fd = fs.openSync(file, fs.constants.O_RDONLY | (fs.constants.O_NOFOLLOW || 0));
            const opened = fields(fs.fstatSync(fd));
            const beforeBig = fs.lstatSync(file, { bigint: true }), openedBig = fs.fstatSync(fd, { bigint: true });
            const identity = stat => Object.fromEntries(["dev", "ino", "mtimeNs", "ctimeNs"].map(key => [key, String(stat[key])]));
            fs.readFileSync(fd);
            const after = fields(fs.fstatSync(fd));
            fs.closeSync(fd); fd = undefined;
            const created = path.join(root, "created", "profile"), first = fs.mkdirSync(created, { recursive: true });
            console.log(JSON.stringify({ probe: "owned-filesystem", node: process.version, before, opened, after, pathAfter: fields(fs.lstatSync(file)), beforeBig: identity(beforeBig), openedBig: identity(openedBig), mkdirBoundaryEquivalent: path.relative(first, path.dirname(created)) === "" }));
          } finally {
            if (fd !== undefined) fs.closeSync(fd);
            const current = fs.lstatSync(root);
            if (!current.isDirectory() || current.isSymbolicLink() || current.dev !== owner.dev || current.ino !== owner.ino) throw new Error("Owned metadata fixture changed");
            fs.rmSync(root, { recursive: true });
          }
          NODE
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build (bash on Windows)
        # Kept inline: `npm run build` shells through cmd on Windows and its
        # &&/quoting fails there (see b28520d). Keep this list in step with the
        # `build` script in package.json — tests/unit/brand-assets.test.ts fails
        # if a shipped resource is missing from either.
        run: |
          rm -rf dist
          npx tsc
          mkdir -p dist/renderer dist/resources
          cp -r src/renderer/index.html src/renderer/storage-migrate.html src/renderer/css src/renderer/js dist/renderer/
          cp src/main/preload.cjs dist/main/
          cp resources/tray-icon-Template.png resources/tray-icon-Template@2x.png dist/resources/
          cp resources/icon.icns resources/icon.ico dist/resources/
          node scripts/build-masque-bridge.mjs
      - name: Unit + smoke tests
        # Failure still exits nonzero; a green run must execute the whole suite.
        run: npx vitest run tests/unit tests/smoke --bail=1 --reporter=default --reporter=hanging-process
      - name: Coverage (unit + smoke, threshold gated)
        run: npx vitest run --coverage tests/unit tests/smoke --bail=1

  e2e-macos:
    name: E2E (macOS, needs locally built engine — see engine-verify)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - run: npm ci
      - name: E2E (skipped without an engine binary)
        run: |
          if [ -n "$AGENT_BROWSER_CHROMIUM_BINARY_PATH" ] || [ -n "$AGENT_BROWSER_CHROMIUM_CACHE_DIR" ]; then
            npm run test:e2e
          else
            echo "no independent engine present; e2e runs in the engine-verify workflow (macOS/large runner)"
          fi
        env:
          AGENT_BROWSER_CHROMIUM_BINARY_PATH: ${{ secrets.AGENT_BROWSER_CHROMIUM_BINARY_PATH }}