name: Engine production verify (multi-platform)

# Heavy multi-platform gate for the last alignment row (signed multi-platform
# distribution): builds the independent Chromium 152 engine from the pinned
# upstream commit, runs the strict 53-surface native verifier and the full e2e
# suite against the freshly built engine, then packages the controller and
# publishes sha256 checksums. Code signing is opt-in via the standard
# electron-builder secrets (CSC_LINK / CSC_KEY_PASSWORD on Windows, and on
# macOS notarization env vars).
#
# Note: a Chromium official build is large. Prefer a runner with >= 16 GB RAM
# for the link step (e.g. GitHub larger runners or self-hosted); the default
# ubuntu/windows-latest labels are used here as a baseline.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform filter (all = 3 platforms, ~2h; pick one for ~40min fast gate)'
        required: false
        default: 'all'
        type: choice
        options: [all, linux, windows, macos]
  schedule:
    - cron: "17 3 * * 1"
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: engine-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHROMIUM_COMMIT: 026bb13a93d60e7adfefa2bbf58d6f57c2d335cc

jobs:
  linux-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    name: Linux x64 · build → verify → e2e → package
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Setup depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "${{ github.workspace }}/depot_tools" >> "$GITHUB_PATH"
      - name: Clone + sync pinned Chromium source
        run: |
          for i in 1 2 3; do
            if [ -d chromium/src/.git ]; then rm -rf chromium; fi
            # Shallow fetch (~4 GiB vs ~40 GiB full) — 10x less disk, 3x faster on GitHub runners
            if mkdir -p chromium/src && git -C chromium/src init -q && git -C chromium/src fetch --depth 1 https://github.com/chromium/chromium.git "$CHROMIUM_COMMIT" -q && git -C chromium/src checkout FETCH_HEAD -q && (printf 'solutions = [{"name": "src", "url": "https://chromium.googlesource.com/chromium/src.git", "managed": False}]\n' > chromium/.gclient && cd chromium/src && (gclient sync -D --no-history 2>/dev/null || gclient sync -D)); then
              break
            fi
            echo "Clone/sync attempt $i failed, retrying in 30s..." >&2
            rm -rf chromium
            sleep 30
            if [ "$i" = "3" ]; then echo "All clone attempts failed" >&2; exit 1; fi
          done
      - name: Install Linux build deps
        run: |
          cd chromium/src
          sudo bash ./build/install-build-deps.sh --no-nacl --no-prompt
      - name: Build independent engine
        run: bash patches/chromium/build-linux.sh "${{ github.workspace }}/chromium/src" x64
      - name: npm ci + build
        run: |
          npm ci
          npm run build
      - name: Strict native verifier (53 surfaces)
        run: node dist/tools/verify-native-chromium.js "${{ github.workspace }}/chromium/src/out/AgentBrowserRelease/chrome"
      - name: E2E suite (xvfb)
        env:
          AGENT_BROWSER_CHROMIUM_BINARY_PATH: ${{ github.workspace }}/chromium/src/out/AgentBrowserRelease/chrome
        run: xvfb-run -a npm run test:e2e
      - name: Package AppImage + checksums
        run: |
          npm run dist
          cd release
          sha256sum *.AppImage > SHA256SUMS.txt
          printf 'engine=chromium-152.0.7977.72\ncommit=%s\n' "${{ github.sha }}" > BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-browser-linux-x64
          path: |
            release/*.AppImage
            release/SHA256SUMS.txt
            release/BUILD.txt
          if-no-files-found: error

  # Sale-91: linux arm64 AppImage (issue asks x64+arm64). Native ARM runner
  # (ubuntu-24.04-arm) — no cross-compile, the engine build needs a real CPU.
  linux-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    name: Linux arm64 · build → verify → e2e → package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Setup depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "${{ github.workspace }}/depot_tools" >> "$GITHUB_PATH"
      - name: Clone + sync pinned Chromium source
        run: |
          for i in 1 2 3; do
            if [ -d chromium/src/.git ]; then rm -rf chromium; fi
            # Shallow fetch (~4 GiB vs ~40 GiB full) — 10x less disk, 3x faster on GitHub runners
            if mkdir -p chromium/src && git -C chromium/src init -q && git -C chromium/src fetch --depth 1 https://github.com/chromium/chromium.git "$CHROMIUM_COMMIT" -q && git -C chromium/src checkout FETCH_HEAD -q && (printf 'solutions = [{"name": "src", "url": "https://chromium.googlesource.com/chromium/src.git", "managed": False}]\n' > chromium/.gclient && cd chromium/src && (gclient sync -D --no-history 2>/dev/null || gclient sync -D)); then
              break
            fi
            echo "Clone/sync attempt $i failed, retrying in 30s..." >&2
            rm -rf chromium
            sleep 30
            if [ "$i" = "3" ]; then echo "All clone attempts failed" >&2; exit 1; fi
          done
      - name: Install Linux build deps
        run: |
          cd chromium/src
          sudo bash ./build/install-build-deps.sh --no-nacl --no-prompt
      - name: Build independent engine
        run: bash patches/chromium/build-linux.sh "${{ github.workspace }}/chromium/src" arm64
      - name: npm ci + build
        run: |
          npm ci
          npm run build
      - name: Strict native verifier (53 surfaces)
        run: node dist/tools/verify-native-chromium.js "${{ github.workspace }}/chromium/src/out/AgentBrowserRelease/chrome"
      - name: E2E suite (xvfb)
        env:
          AGENT_BROWSER_CHROMIUM_BINARY_PATH: ${{ github.workspace }}/chromium/src/out/AgentBrowserRelease/chrome
        run: xvfb-run -a npm run test:e2e
      - name: Package AppImage + checksums
        run: |
          npm run dist
          cd release
          sha256sum *.AppImage > SHA256SUMS.txt
          printf 'engine=chromium-152.0.7977.72\ncommit=%s\n' "${{ github.sha }}" > BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-browser-linux-arm64
          path: |
            release/*.AppImage
            release/SHA256SUMS.txt
            release/BUILD.txt
          if-no-files-found: error

  windows-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    name: Windows x64 · build → verify → e2e → package
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Setup depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "${{ github.workspace }}/depot_tools" >> "$GITHUB_PATH"
      # Chromium has paths >260 chars — Windows Git must allow long paths
      # or checkout fails with "Filename too long" (standard Chromium/Windows
      # prerequisite). --global (not --system): runner-safe, no elevation
      # needed, and it covers the later manual Chromium clone. Our own repo
      # checkout needs no long paths.
      - name: Enable Windows long paths
        run: git config --global core.longpaths true
      - name: Clone + sync pinned Chromium source
        run: |
          for i in 1 2 3; do
            if [ -d chromium/src/.git ]; then rm -rf chromium; fi
            # Shallow fetch (~4 GiB vs ~40 GiB full) — 10x less disk, 3x faster on GitHub runners
            if mkdir -p chromium/src && git -C chromium/src init -q && git -C chromium/src fetch --depth 1 https://github.com/chromium/chromium.git "$CHROMIUM_COMMIT" -q && git -C chromium/src checkout FETCH_HEAD -q && (printf 'solutions = [{"name": "src", "url": "https://chromium.googlesource.com/chromium/src.git", "managed": False}]\n' > chromium/.gclient && cd chromium/src && (gclient sync -D --no-history 2>/dev/null || gclient sync -D)); then
              break
            fi
            echo "Clone/sync attempt $i failed, retrying in 30s..." >&2
            rm -rf chromium
            sleep 30
            if [ "$i" = "3" ]; then echo "All clone attempts failed" >&2; exit 1; fi
          done
      - name: Build independent engine
        run: bash patches/chromium/build-windows.sh "${{ github.workspace }}/chromium/src" x64
      - name: npm ci + controller build (bash)
        run: |
          npm ci
          rm -rf dist
          npx tsc
          mkdir -p dist/renderer dist/resources
          cp -r src/renderer/index.html src/renderer/css src/renderer/js dist/renderer/
          cp src/main/preload.cjs dist/main/
          cp resources/tray-icon-Template.png dist/resources/
          cp resources/icon.icns dist/resources/
          node scripts/build-masque-bridge.mjs
      - name: Strict native verifier (53 surfaces)
        run: node dist/tools/verify-native-chromium.js "${{ github.workspace }}/chromium/src/out/AgentBrowserRelease/chrome.exe"
      - name: E2E suite
        env:
          AGENT_BROWSER_CHROMIUM_BINARY_PATH: ${{ github.workspace }}/chromium/src/out/AgentBrowserRelease/chrome.exe
        run: npm run test:e2e
      - name: Package NSIS + checksums
        run: |
          npm run dist
          cd release
          sha256sum *.exe > SHA256SUMS.txt
          printf 'engine=chromium-152.0.7977.72\ncommit=%s\n' "${{ github.sha }}" > BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-browser-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/BUILD.txt
          if-no-files-found: error

  macos-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    name: macOS arm64 · build → verify → e2e → package → notarize
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - name: Free disk (macOS image is 14 GiB, Chromium needs 40 GiB)
        run: |
          echo "Before:" && df -h /
          sudo rm -rf /Library/Developer/CoreSimulator 2>/dev/null; sudo rm -rf ~/Library/Caches/* 2>/dev/null; brew cleanup -s 2>/dev/null || true
          echo "After:" && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Setup depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "${{ github.workspace }}/depot_tools" >> "$GITHUB_PATH"
      - name: Clone + sync pinned Chromium source
        run: |
          for i in 1 2 3; do
            if [ -d chromium/src/.git ]; then rm -rf chromium; fi
            # Shallow fetch (~4 GiB vs ~40 GiB) — also add disk cleanup happens above for macos
            if mkdir -p chromium/src && git -C chromium/src init -q && git -C chromium/src fetch --depth 1 https://github.com/chromium/chromium.git "$CHROMIUM_COMMIT" -q && git -C chromium/src checkout FETCH_HEAD -q && (printf 'solutions = [{"name": "src", "url": "https://chromium.googlesource.com/chromium/src.git", "managed": False}]\n' > chromium/.gclient && cd chromium/src && gclient sync -D); then
              break
            fi
            echo "Clone/sync attempt $i failed, retrying in 30s..." >&2
            sleep 30
            if [ "$i" = "3" ]; then echo "All clone attempts failed" >&2; exit 1; fi
          done
      - name: Build independent engine (arm64)
        run: bash patches/chromium/build-macos.sh "${{ github.workspace }}/chromium/src" arm64
      - name: npm ci + build
        run: |
          npm ci
          npm run build
      - name: Strict native verifier (53 surfaces)
        run: node dist/tools/verify-native-chromium.js "${{ github.workspace }}/chromium/src/out/AgentBrowserRelease/Chromium.app/Contents/MacOS/Chromium"
      - name: E2E suite (headed)
        env:
          AGENT_BROWSER_CHROMIUM_BINARY_PATH: ${{ github.workspace }}/chromium/src/out/AgentBrowserRelease/Chromium.app/Contents/MacOS/Chromium
        run: npm run test:e2e
      - name: Package DMG/zip + notarize (opt-in) + checksums
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            npm run dist -- -c.mac.notarize=true
          else
            npm run dist
          fi
          cd release
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          printf 'engine=chromium-152.0.7977.72\ncommit=%s\n' "${{ github.sha }}" > BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-browser-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
            release/BUILD.txt
          if-no-files-found: error
