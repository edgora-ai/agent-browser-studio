name: Engine production verify (multi-platform)

# Heavy multi-platform gate for the last alignment row (signed multi-platform
# distribution): builds the independent Chromium 152 engine from the pinned
# upstream commit, runs the strict 53-surface native verifier and the full e2e
# suite against the freshly built engine, then packages the controller and
# publishes sha256 checksums. Code signing is opt-in via the standard
# electron-builder secrets (CSC_LINK / CSC_KEY_PASSWORD on Windows, and on
# macOS notarization env vars).
#
# Note: a Chromium official build is large. Prefer a runner with >= 16 GB RAM
# for the link step (e.g. GitHub larger runners or self-hosted); the default
# ubuntu/windows-latest labels are used here as a baseline.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: engine-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHROMIUM_COMMIT: 026bb13a93d60e7adfefa2bbf58d6f57c2d335cc

jobs:
  linux-x64:
    name: Linux x64 · build → verify → e2e → package
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Setup depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "${{ github.workspace }}/depot_tools" >> "$GITHUB_PATH"
      - name: Clone + sync pinned Chromium source
        run: |
          git clone https://chromium.googlesource.com/chromium/src.git chromium-src-152
          git -C chromium-src-152 checkout "$CHROMIUM_COMMIT"
          cd chromium-src-152 && gclient sync -D
      - name: Install Linux build deps
        run: |
          cd chromium-src-152
          sudo bash ./build/install-build-deps.sh --no-nacl --no-prompt
      - name: Build independent engine
        run: bash patches/chromium/build-linux.sh "${{ github.workspace }}/chromium-src-152" x64
      - name: npm ci + build
        run: |
          npm ci
          npm run build
      - name: Strict native verifier (53 surfaces)
        run: node dist/tools/verify-native-chromium.js "${{ github.workspace }}/chromium-src-152/out/AgentBrowserRelease/chrome"
      - name: E2E suite (xvfb)
        env:
          AGENT_BROWSER_CHROMIUM_BINARY_PATH: ${{ github.workspace }}/chromium-src-152/out/AgentBrowserRelease/chrome
        run: xvfb-run -a npm run test:e2e
      - name: Package AppImage + checksums
        run: |
          npm run dist
          cd release
          sha256sum *.AppImage > SHA256SUMS.txt
          printf 'engine=chromium-152.0.7977.72\ncommit=%s\n' "${{ github.sha }}" > BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-browser-linux-x64
          path: |
            release/*.AppImage
            release/SHA256SUMS.txt
            release/BUILD.txt
          if-no-files-found: error

  windows-x64:
    name: Windows x64 · build → verify → e2e → package
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Setup depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "${{ github.workspace }}/depot_tools" >> "$GITHUB_PATH"
      - name: Clone + sync pinned Chromium source
        run: |
          git clone https://chromium.googlesource.com/chromium/src.git chromium-src-152
          git -C chromium-src-152 checkout "$CHROMIUM_COMMIT"
          cd chromium-src-152 && gclient sync -D
      - name: Build independent engine
        run: bash patches/chromium/build-windows.sh "${{ github.workspace }}/chromium-src-152" x64
      - name: npm ci + controller build (bash)
        run: |
          npm ci
          rm -rf dist
          npx tsc
          mkdir -p dist/renderer dist/resources
          cp -r src/renderer/index.html src/renderer/css src/renderer/js dist/renderer/
          cp src/main/preload.cjs dist/main/
          cp resources/tray-icon-Template.png dist/resources/
          cp resources/icon.icns dist/resources/
          node scripts/build-masque-bridge.mjs
      - name: Strict native verifier (53 surfaces)
        run: node dist/tools/verify-native-chromium.js "${{ github.workspace }}/chromium-src-152/out/AgentBrowserRelease/chrome.exe"
      - name: E2E suite
        env:
          AGENT_BROWSER_CHROMIUM_BINARY_PATH: ${{ github.workspace }}/chromium-src-152/out/AgentBrowserRelease/chrome.exe
        run: npm run test:e2e
      - name: Package NSIS + checksums
        run: |
          npm run dist
          cd release
          sha256sum *.exe > SHA256SUMS.txt
          printf 'engine=chromium-152.0.7977.72\ncommit=%s\n' "${{ github.sha }}" > BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-browser-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/BUILD.txt
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64 · build → verify → e2e → package → notarize
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Setup depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "${{ github.workspace }}/depot_tools" >> "$GITHUB_PATH"
      - name: Clone + sync pinned Chromium source
        run: |
          git clone https://chromium.googlesource.com/chromium/src.git chromium-src-152
          git -C chromium-src-152 checkout "$CHROMIUM_COMMIT"
          cd chromium-src-152 && gclient sync -D
      - name: Build independent engine (arm64)
        run: bash patches/chromium/build-macos.sh "${{ github.workspace }}/chromium-src-152" arm64
      - name: npm ci + build
        run: |
          npm ci
          npm run build
      - name: Strict native verifier (53 surfaces)
        run: node dist/tools/verify-native-chromium.js "${{ github.workspace }}/chromium-src-152/out/AgentBrowserRelease/Chromium.app/Contents/MacOS/Chromium"
      - name: E2E suite (headed)
        env:
          AGENT_BROWSER_CHROMIUM_BINARY_PATH: ${{ github.workspace }}/chromium-src-152/out/AgentBrowserRelease/Chromium.app/Contents/MacOS/Chromium
        run: npm run test:e2e
      - name: Package DMG/zip + notarize (opt-in) + checksums
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            npm run dist -- -c.mac.notarize=true
          else
            npm run dist
          fi
          cd release
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          printf 'engine=chromium-152.0.7977.72\ncommit=%s\n' "${{ github.sha }}" > BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-browser-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
            release/BUILD.txt
          if-no-files-found: error
