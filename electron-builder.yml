appId: com.ahoo.agent-browser-studio
productName: Agent Browser Studio
copyright: Copyright © 2026
afterPack: scripts/after-pack.mjs
# NOTE: no `electronDist` here on purpose.
#
# It was added for reproducible offline packaging, and it does that — but it
# pins the Electron binary to node_modules/electron/dist, which is whichever
# arch this machine installed (arm64 here). electron-builder then reuses that
# directory for *every* requested target arch without checking it. So
# `--mac zip --x64` silently produced an arm64 app named "-mac-x64.zip": a
# package Intel users cannot launch, labelled as if they could.
#
# Omitting it makes electron-builder resolve the Electron build matching the
# requested arch (cached under ~/Library/Caches/electron after first fetch).
# For an offline/air-gapped build, point it at a matching dist explicitly:
#   npx electron-builder --mac zip --x64 -c.electronDist=/path/to/electron-x64

icon: dist/resources/icon.icns

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64, x64]
  artifactName: Agent-Browser-Studio-${version}-mac-${arch}.${ext}
  icon: dist/resources/icon.icns
  extraResources:
    - from: native-browsers/mac
      to: native-browsers

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Agent-Browser-Studio-${version}-win-${arch}.${ext}
  # Win-static-audit P1-4: NSIS needs .ico (global icon is mac .icns).
  icon: dist/resources/icon.ico
  extraResources:
    - from: native-browsers/win
      to: native-browsers

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
  category: Network
  maintainer: ahoo
  artifactName: Agent-Browser-Studio-${version}-linux-${arch}.${ext}
  extraResources:
    - from: native-browsers/linux
      to: native-browsers

# Signing is opt-in and driven by standard electron-builder env vars so local
# builds stay unsigned:
#   macOS notarization: set mac.notarize=true plus APPLE_ID /
#     APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (and CSC_LINK for signing).
#   Windows code signing: set CSC_LINK (pfx) + CSC_KEY_PASSWORD.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

directories:
  output: release

files:
  - package.json
  - dist/main/**/*
  - dist/renderer/**/*
  - dist/resources/**/*
  - dist/tools/webgl-corpus.js
  - dist/tools/webgpu-corpus.js
  - dist/tools/font-corpus.js

extraResources:
  - from: dist/native
    to: native

asar: true
compression: maximum
