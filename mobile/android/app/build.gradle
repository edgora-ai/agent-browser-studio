plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ahoo.abs.android'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.ahoo.abs.android.preview'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0-dev'
        def verificationSuite = System.getenv('ABS_ANDROID_VERIFICATION_SUITE') ?: 'owned'
        def verificationRunners = [
            owned: 'com.ahoo.abs.android.verification.OwnedInstrumentation',
            lifecycle: 'com.ahoo.abs.android.verification.LifecycleInstrumentation'
        ]
        if (!verificationRunners.containsKey(verificationSuite)) {
            throw new GradleException('ABS_ANDROID_VERIFICATION_SUITE must be owned or lifecycle.')
        }
        testInstrumentationRunner verificationRunners[verificationSuite]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            def keyPath = System.getenv('ABS_ANDROID_DEBUG_KEYSTORE')
            if (keyPath == null || keyPath.isBlank()) {
                throw new GradleException('Set an isolated ABS_ANDROID_DEBUG_KEYSTORE; see tools/build.py.')
            }
            storeFile file(keyPath)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-internal'
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

// A development APK is not a replacement for the commercial desktop release.
// Enable production variants only after licensing and mobile acceptance are integrated.
androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant ->
        variant.enable = false
    }
}

dependencies {
    implementation project(':core')
    implementation 'androidx.webkit:webkit:1.12.1'
}
